name: Verify Fourth Seat engine integration

on:
  push:
    branches: [integration/xmage, feature/online-commander-ai]
    paths:
      - '.github/workflows/fourth-seat.yml'
      - 'integrations/fourth-seat/**'
      - 'integrations/nexus/browser/reusable-build.json'
      - 'integrations/nexus/upstream.json'
      - 'scripts/build-xmage-bridge.sh'
      - 'scripts/build-online-commander-ai.sh'
      - 'experiments/commander-ai/**'
      - 'scripts/run-fourth-seat.py'
      - 'scripts/verify-engine-container.py'
      - '.dockerignore'
      - 'scripts/reuse-xmage-build.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fourth-seat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Deck-aware AI, paired engine and online gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read dependency pins
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('integrations/nexus/upstream.json').read_text())
          assert pin['repository'] == 'Adamychen/xmage-nexus'
          for key in ('bridgeCommit', 'serverForkCommit', 'upstreamBaseline'):
              assert re.fullmatch(r'[0-9a-f]{40}', pin[key])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in pin.items():
                  assert '\n' not in value and '\r' not in value
                  print(f'{key}={value}', file=output)
          PY
      - name: Check out pinned bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.bridgeCommit }}
          path: .upstream/nexus
          persist-credentials: false
      - name: Check out pinned server compatibility fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.serverForkCommit }}
          path: .upstream/nexus-server
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.pin.outputs.javaVersion }}
          cache: maven
          cache-dependency-path: |
            integrations/nexus/upstream.json
            .upstream/nexus/Mage.Proxy/pom.xml
            .upstream/nexus-server/**/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.pin.outputs.nodeVersion }}
      - name: Build accepted deck-aware AI and matching core/bridge together
        run: bash scripts/build-online-commander-ai.sh
      - name: Verify frozen decks and deterministic policy
        run: |
          python3 experiments/commander-ai/scripts/verify-deck-pool.py
          bash experiments/commander-ai/test.sh
      - name: Verify actual engine costs, choices and compatibility
        run: bash experiments/commander-ai/adapter/test/run-real-engine-tests.sh build/online-commander-ai/server
      - name: Complete nine real games with all ten decks
        timeout-minutes: 46
        run: |
          set -euo pipefail
          export SOAK_ARTIFACT_CP_FILE="$PWD/build/online-commander-ai/artifact-runtime-classpath.txt"
          for round in 0 1 2; do
            bash experiments/commander-ai/scripts/run-soak.sh \
              build/online-commander-ai/server build/online-commander-ai/m2 \
              "build/commander-soak-$round" "$((20261016 + round * 100))" 120 300 "$((round * 3))"
          done
      - name: Install gateway dependencies
        working-directory: integrations/fourth-seat/gateway
        run: npm ci --ignore-scripts
      - name: Verify adapter and gateway policies
        run: |
          node --test integrations/fourth-seat/tests/*.test.mjs
          python3 -m unittest discover -s integrations/fourth-seat/hosting -p "test_*.py"
      - name: Verify independent engine gateway on our private server
        timeout-minutes: 12
        run: python3 scripts/run-fourth-seat.py
      - name: Check deployable container under a four-GB memory limit
        timeout-minutes: 14
        run: python3 scripts/verify-engine-container.py
      - name: Upload verified deployment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fourth-seat-engine-${{ github.sha }}
          path: |
            build/nexus/mage-server.zip
            build/nexus/mage-proxy-1.4.62.jar
            build/nexus/commander-ai-manifest.json
            build/nexus/integration-commit.txt
            build/nexus/ai-source-sha256.txt
            build/nexus/upstream.json
            build/nexus/*LICENSE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload service proof and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fourth-seat-integration-${{ github.run_id }}
          path: |
            build/nexus/fourth-seat/*.png
            build/nexus/fourth-seat/*state.json
            build/nexus/fourth-seat/*dom.txt
            build/nexus/fourth-seat/ai-decks-result.json
            build/nexus/fourth-seat/result.json
            build/nexus/fourth-seat/container-result.json
            build/nexus/fourth-seat/container.log
            build/nexus/fourth-seat-runtime-result.json
            build/nexus/browser-runtime-config.xml
            build/nexus/*manifest*.json
            build/nexus/*version.txt
            build/nexus/integration-commit.txt
            build/nexus/ai-source-sha256.txt
            build/nexus/upstream.json
            build/commander-soak-*/results.json
            build/commander-soak-*/summary.log
            build/commander-soak-*/pod-*.log
            build/online-commander-ai/counter-core-build.log
            build/online-commander-ai/server/Mage/src/main/java/mage/counters/CounterObserverRegistry.java
            build/online-commander-ai/bridge/Mage.Proxy/target/surefire-reports/
            build/nexus/server.log
            build/nexus/server-classes.log
            build/nexus/proxy.log
            build/nexus/web*.log
            build/nexus/*LICENSE.txt
            .upstream/nexus/Mage.Proxy/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

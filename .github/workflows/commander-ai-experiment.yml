name: Isolated Commander AI tests
on:
  push:
    branches: [feature/commander-ai-policy-v1]
    paths:
      - 'experiments/commander-ai/src/**'
      - 'experiments/commander-ai/adapter/src/**'
      - 'experiments/commander-ai/adapter/test/**/*.java'
      - 'experiments/commander-ai/adapter/test/*.sh'
      - 'experiments/commander-ai/adapter/soak/**/*.java'
      - 'experiments/commander-ai/adapter/soak/*.py'
      - 'experiments/commander-ai/adapter/soak/*.properties'
      - 'experiments/commander-ai/scripts/**'
      - 'experiments/commander-ai/test.sh'
      - 'experiments/commander-ai/deck-snapshot.json'
      - 'integrations/fourth-seat/gateway/ai-decks.json'
      - '.github/workflows/commander-ai-experiment.yml'
concurrency:
  group: commander-ai-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolated-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Deterministic policy scenarios
        run: |
          set -euo pipefail
          python3 experiments/commander-ai/scripts/verify-deck-pool.py
          python3 experiments/commander-ai/scripts/test-package-artifact.py
          bash experiments/commander-ai/test.sh | tee "$RUNNER_TEMP/commander-policy.log"
      - name: Fetch exact XMage source
        run: |
          git init "$RUNNER_TEMP/xmage-source"
          git -C "$RUNNER_TEMP/xmage-source" remote add origin https://github.com/Adamychen/xmage-nexus.git
          git -C "$RUNNER_TEMP/xmage-source" fetch --depth 1 origin 825d1205acca114825f235c6993f1e5a6a6db9fa
          git -C "$RUNNER_TEMP/xmage-source" checkout --detach FETCH_HEAD
      - name: Compile actual engine adapter, without registering or deploying
        env:
          MAVEN_OPTS: -Xmx4g
        run: bash experiments/commander-ai/scripts/build-adapter.sh "$RUNNER_TEMP/xmage-source" "$RUNNER_TEMP/xmage-build"
      - name: Real-engine decision and payment scenarios
        run: |
          set -euo pipefail
          bash experiments/commander-ai/adapter/test/run-real-engine-tests.sh "$RUNNER_TEMP/xmage-build" | tee "$RUNNER_TEMP/commander-engine.log"

      - name: Nine real Commander games across all ten frozen decks
        run: |
          set -euo pipefail
          for round in 0 1 2; do
            bash experiments/commander-ai/scripts/run-soak.sh \
              "$RUNNER_TEMP/xmage-build" "$RUNNER_TEMP/xmage-build/.m2" \
              "$RUNNER_TEMP/commander-soak-$round" "$((20261016 + round * 100))" 120 300 "$((round * 3))"
          done
      - name: Package only the verified inactive plugin
        run: |
          python3 experiments/commander-ai/scripts/package-artifact.py \
            --build "$RUNNER_TEMP/xmage-build" \
            --results "$RUNNER_TEMP/commander-soak-0/results.json" "$RUNNER_TEMP/commander-soak-1/results.json" "$RUNNER_TEMP/commander-soak-2/results.json" \
            --policy-log "$RUNNER_TEMP/commander-policy.log" --engine-log "$RUNNER_TEMP/commander-engine.log" \
            --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/commander-ai-artifact"
      - name: Upload tested experimental artifact without deploying
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commander-ai-experimental-${{ github.sha }}
          path: ${{ runner.temp }}/commander-ai-artifact/
          if-no-files-found: error
          retention-days: 30

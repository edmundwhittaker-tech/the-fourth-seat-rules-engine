name: Verify private XMage Nexus bridge

on:
  push:
    branches: [integration/xmage]
    paths:
      - '.github/workflows/xmage-bridge.yml'
      - 'integrations/nexus/**'
      - 'scripts/build-xmage-bridge.sh'
      - 'scripts/run-xmage-bridge.py'
      - 'scripts/verify-xmage-bridge.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xmage-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Build and verify private server bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAVEN_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read dependency pins
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('integrations/nexus/upstream.json').read_text())
          assert pin['repository'] == 'Adamychen/xmage-nexus'
          for key in ('bridgeCommit', 'serverForkCommit', 'upstreamBaseline'):
              assert re.fullmatch(r'[0-9a-f]{40}', pin[key])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in pin.items():
                  assert '\n' not in value and '\r' not in value
                  print(f'{key}={value}', file=output)
          PY
      - name: Check out pinned bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.bridgeCommit }}
          path: .upstream/nexus
          persist-credentials: false
      - name: Check out pinned server compatibility fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.serverForkCommit }}
          path: .upstream/nexus-server
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.pin.outputs.javaVersion }}
          cache: maven
          cache-dependency-path: |
            integrations/nexus/upstream.json
            .upstream/nexus/Mage.Proxy/pom.xml
            .upstream/nexus-server/**/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.pin.outputs.nodeVersion }}
      - name: Compile server and test/package bridge
        run: bash scripts/build-xmage-bridge.sh
      - name: Verify private runtime and JSON protocol
        timeout-minutes: 15
        run: python3 scripts/run-xmage-bridge.py
      - name: Upload integration evidence and binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xmage-bridge-evidence-${{ github.run_id }}
          path: |
            build/nexus/
            .upstream/nexus/Mage.Proxy/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14
